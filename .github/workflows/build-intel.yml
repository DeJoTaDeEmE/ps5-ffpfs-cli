
name: Build macOS Intel x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-intel:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller customtkinter mkpfs
          python -m pip install ./unrar

      - name: Build Intel application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name PS5-FFPFS-CLI \
            --hidden-import tkinter \
            --hidden-import mkpfs.cli \
            --hidden-import multiprocessing \
            --hidden-import unrar \
            --hidden-import unrar.rarfile \
            --hidden-import unrar._unrar \
            --collect-data customtkinter \
            --collect-data mkpfs \
            --collect-binaries mkpfs \
            --collect-all unrar \
            gui.py

      - name: Verify Intel architecture
        run: |
          file "dist/PS5-FFPFS-CLI.app/Contents/MacOS/PS5-FFPFS-CLI"
          lipo "dist/PS5-FFPFS-CLI.app/Contents/MacOS/PS5-FFPFS-CLI" -verify_arch x86_64

      - name: Package application
        run: |
          ditto -c -k --keepParent \
            "dist/PS5-FFPFS-CLI.app" \
            "PS5-FFPFS-CLI-macOS-Intel.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: PS5-FFPFS-CLI-macOS-Intel
          path: PS5-FFPFS-CLI-macOS-Intel.zip
