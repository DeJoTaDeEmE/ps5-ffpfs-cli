name: Build and validate macOS Intel x86_64

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ['codex/validate-single-exfat-container']

permissions:
  contents: read

jobs:
  build-intel:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          architecture: x64
      - name: Install pinned dependencies
        run: |
          test "$(uname -m)" = x86_64
          python -m pip install -r requirements-build.txt
          python -m pip install ./unrar
          python -m pip check
          mkdir -p validation
          python -m pip freeze > validation/dependencies.txt
          git rev-parse HEAD > validation/application-commit.txt
          sw_vers > validation/runner.txt
      - name: Test source pipeline
        run: |
          set -o pipefail
          python tests/validate_conversion.py 2>&1 | tee validation/source-tests.log
      - name: Build Intel application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --name PS5-FFPFS-CLI --target-architecture x86_64 \
            --osx-bundle-identifier com.dejotadeeme.ps5-ffpfs-cli \
            --hidden-import tkinter --hidden-import mkpfs.cli \
            --hidden-import multiprocessing --collect-all customtkinter \
            --collect-all mkpfs --collect-all cryptography \
            --collect-all zlib_ng --collect-all isal --collect-all unrar gui.py
      - name: Verify every Mach-O architecture and deployment target
        run: |
          python - <<'PY'
          import pathlib, subprocess, re
          files = []
          for path in pathlib.Path('dist/PS5-FFPFS-CLI.app').rglob('*'):
              if not path.is_file() or path.is_symlink():
                  continue
              info = subprocess.check_output(['file', '-b', str(path)], text=True)
              if 'Mach-O' not in info:
                  continue
              subprocess.run(['lipo', str(path), '-verify_arch', 'x86_64'], check=True)
              load = subprocess.check_output(['otool', '-l', str(path)], text=True)
              for block in load.split('Load command'):
                  if 'LC_BUILD_VERSION' in block or 'LC_VERSION_MIN_MACOSX' in block:
                      match = re.search(r'(?:minos|version)\s+(\d+)\.(\d+)', block)
                      if match and tuple(map(int, match.groups())) > (15, 0):
                          raise SystemExit(f'{path} requires newer macOS: {match.group(0)}')
              files.append(str(path))
          assert files, 'No Mach-O files found'
          pathlib.Path('validation/architecture.txt').write_text('\n'.join(files) + '\n')
          PY
      - name: Sign and validate application
        run: |
          codesign --force --deep --sign - dist/PS5-FFPFS-CLI.app
          codesign --verify --deep --strict --verbose=2 dist/PS5-FFPFS-CLI.app
      - name: Test actual bundled GUI and MkPFS conversions
        run: |
          set -o pipefail
          python tests/validate_conversion.py \
            --binary "$PWD/dist/PS5-FFPFS-CLI.app/Contents/MacOS/PS5-FFPFS-CLI" \
            2>&1 | tee validation/bundled-tests.log
      - name: Package tested application and evidence
        run: |
          cp README.md VALIDATION.md dist/
          cp -R validation dist/
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PS5-FFPFS-CLI.app PS5-FFPFS-CLI-macOS-Intel.zip
          shasum -a 256 PS5-FFPFS-CLI-macOS-Intel.zip > PS5-FFPFS-CLI-macOS-Intel.zip.sha256
          ditto -c -k --keepParent validation validation-evidence.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PS5-FFPFS-CLI-macOS-Intel
          if-no-files-found: error
          path: |
            PS5-FFPFS-CLI-macOS-Intel.zip
            PS5-FFPFS-CLI-macOS-Intel.zip.sha256
            validation-evidence.zip
      - name: Preserve test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-validation-logs
          path: validation/
