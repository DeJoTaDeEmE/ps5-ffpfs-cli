
name: Build macOS Intel x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-intel:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller customtkinter mkpfs
          python -m pip install --force-reinstall --no-cache-dir --only-binary=:all: 'cryptography==45.0.7'
          python -c "from cryptography.hazmat.primitives.ciphers.aead import AESGCM; print('Host cryptography OK')"
          python -m pip install ./unrar

      - name: Build Intel application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name PS5-FFPFS-CLI \
            --hidden-import tkinter \
            --hidden-import mkpfs.cli \
            --hidden-import multiprocessing \
            --hidden-import unrar \
            --hidden-import unrar.rarfile \
            --hidden-import unrar._unrar \
            --collect-data customtkinter \
            --collect-all mkpfs \
            --collect-all cryptography \
            --hidden-import cryptography.hazmat.bindings._rust \
            --collect-all unrar \
            gui.py

      - name: Verify Intel architecture
        run: |
          file "dist/PS5-FFPFS-CLI.app/Contents/MacOS/PS5-FFPFS-CLI"
          lipo "dist/PS5-FFPFS-CLI.app/Contents/MacOS/PS5-FFPFS-CLI" -verify_arch x86_64

      - name: Smoke test bundled MkPFS crypto
        run: |
          BIN="dist/PS5-FFPFS-CLI.app/Contents/MacOS/PS5-FFPFS-CLI"
          echo "Checking packaged crypto libraries"
          find "dist/PS5-FFPFS-CLI.app" -type f \( -name 'libssl*.dylib' -o -name '*_rust*.so' \) -print
          "$BIN" --mkpfs-internal --help > /tmp/mkpfs-smoke.log 2>&1 || {
            cat /tmp/mkpfs-smoke.log
            echo "::error::Bundled MkPFS failed its runtime smoke test"
            exit 1
          }
          head -40 /tmp/mkpfs-smoke.log

      - name: Package application
        run: |
          ditto -c -k --keepParent \
            "dist/PS5-FFPFS-CLI.app" \
            "PS5-FFPFS-CLI-macOS-Intel.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: PS5-FFPFS-CLI-macOS-Intel
          path: PS5-FFPFS-CLI-macOS-Intel.zip
