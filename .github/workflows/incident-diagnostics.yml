name: Headless incident regression tests
on:
  workflow_dispatch:
  push:
    branches: ['codex/conversion-incident-protection']
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Test persistent diagnostics and close protection without desktop interaction
        run: python tests/test_runtime_protection.py
      - name: Install pinned source dependencies
        run: python -m pip install -r requirements.txt
      - name: Retain existing synthetic conversion tests
        run: python tests/validate_conversion.py
